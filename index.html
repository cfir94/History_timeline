<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ציר הזמן ההיסטורי — מורי דרך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;600;700;900&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A2118;
    --sub: #6B5D4F;
    --bg: #EDE6D6;
    --paper: #FAF6EC;
    --paper-2: #F3ECDC;
    --line: #C9BCA0;
    --line-soft: #DDD3BC;
    --judah: #A6531F;
    --judah-light: #F3DCC7;
    --judah-dim: #C98F63;
    --israel: #2F6E62;
    --israel-light: #D9EAE4;
    --israel-dim: #6FA396;
    --gold: #A5780F;
    --gold-light: #F1E2BC;
    --good: #3C7A46;
    --good-light: #E1EFE3;
    --bad: #A13B2E;
    --bad-light: #F6E2DE;
    --shadow: 0 3px 10px rgba(42,33,24,0.09);
    --shadow-lift: 0 8px 22px rgba(42,33,24,0.16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Assistant", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0 0 80px;
    line-height: 1.65;
  }
  h1, h2, h3, .display { font-family: "Frank Ruhl Libre", "Times New Roman", serif; text-wrap: balance; }
  button, input { font-family: "Assistant", Arial, sans-serif; }
  :focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

  /* ===== Ruler motif — used under header & as section dividers ===== */
  .ruler {
    height: 10px;
    background-image: repeating-linear-gradient(90deg, var(--gold) 0 1.5px, transparent 1.5px 24px),
                       repeating-linear-gradient(90deg, var(--gold) 0 1.5px, transparent 1.5px 8px);
    background-size: 100% 10px, 100% 5px;
    background-position: top, bottom;
    background-repeat: repeat-x;
    opacity: 0.55;
  }

  header {
    background: var(--ink);
    color: var(--paper);
  }
  .header-inner { max-width: 900px; margin: 0 auto; padding: 20px 24px 16px; }
  header h1 { margin: 0 0 5px; font-size: 22px; font-weight: 700; }
  header .sub { font-size: 13px; opacity: 0.75; font-family: "Assistant", sans-serif; }
  header .crumb { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--gold-light); cursor: pointer; }
  header .crumb:hover { text-decoration: underline; }
  #scorebar {
    display: none;
    margin-top: 10px;
    font-size: 14px;
    font-weight: 700;
    background: rgba(250,246,236,0.14);
    border-radius: 8px;
    padding: 7px 14px;
    width: fit-content;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 900px; margin: 0 auto; padding: 32px 18px; }

  /* ===== Home ===== */
  .home-hero { text-align: center; margin-bottom: 34px; }
  .hero-strip {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .hero-strip span {
    display: inline-block;
    width: 30px; height: 8px;
    border-radius: 2px;
  }
  .home-hero h2 { font-size: 30px; margin: 0 0 12px; color: var(--ink); font-weight: 700; }
  .home-hero p { color: var(--sub); font-size: 15.5px; max-width: 540px; margin: 0 auto; }
  .mode-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 640px) { .mode-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .mode-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 4px solid var(--gold);
    border-radius: 4px;
    padding: 26px 22px;
    text-align: right;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    display: flex;
    flex-direction: column;
    gap: 9px;
    box-shadow: var(--shadow);
  }
  .mode-card:hover { border-top-color: var(--judah); box-shadow: var(--shadow-lift); transform: translateY(-3px); }
  .mode-card:nth-child(2):hover { border-top-color: var(--israel); }
  .mode-card .glyph { font-size: 26px; }
  .mode-card h3 { margin: 0; font-size: 18.5px; color: var(--ink); font-weight: 700; }
  .mode-card p { margin: 0; font-size: 13.5px; color: var(--sub); }

  /* ===== Section select screens ===== */
  .select-screen { text-align: center; padding: 4px 16px; }
  .select-screen h2 { font-size: 24px; margin: 0 0 8px; color: var(--ink); }
  .select-screen .lede { color: var(--sub); font-size: 14.5px; margin-bottom: 28px; max-width: 520px; margin-inline: auto; }
  .topic-btn {
    display: block;
    width: 100%;
    max-width: 480px;
    margin: 0 auto 13px;
    padding: 16px 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-inline-start: 5px solid var(--gold);
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
    text-align: right;
    box-shadow: var(--shadow);
  }
  .topic-btn:hover { border-inline-start-color: var(--judah); box-shadow: var(--shadow-lift); transform: translateX(-2px); }
  .topic-btn .tb-title { display: block; font-family: "Frank Ruhl Libre", serif; font-size: 17px; font-weight: 700; color: var(--ink); }
  .topic-btn .tb-sub { display: block; font-size: 12.5px; color: var(--sub); font-weight: 400; margin-top: 4px; }

  /* ===== Quiz cards ===== */
  .section-title { font-size: 21px; font-weight: 700; margin: 30px 0 4px; color: var(--ink); }
  .section-sub { font-size: 13.5px; color: var(--sub); margin: 0 0 22px; }
  .qcard {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 19px 21px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .qtopic {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--gold);
    background: var(--gold-light);
    border-radius: 3px;
    padding: 3px 9px;
    margin-bottom: 9px;
  }
  .qtext { font-size: 15.5px; font-weight: 700; margin-bottom: 13px; }
  .opt {
    display: block;
    width: 100%;
    text-align: right;
    padding: 11px 14px;
    margin-bottom: 8px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    font-size: 14.5px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.12s;
  }
  .opt:hover:not(.locked) { border-color: var(--gold); background: var(--gold-light); }
  .opt.correct { background: var(--good-light); border-color: var(--good); color: var(--good); font-weight: 700; }
  .opt.incorrect { background: var(--bad-light); border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .opt.locked { cursor: default; }
  .explain {
    margin-top: 11px;
    font-size: 13px;
    color: var(--sub);
    background: var(--paper-2);
    border-radius: 4px;
    padding: 11px 13px;
    display: none;
    border-inline-start: 3px solid var(--line);
  }
  .fill-input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--line);
    border-radius: 4px;
    font-size: 14.5px;
    margin-bottom: 10px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  .fill-input:focus { border-color: var(--gold); }
  .reveal-btn, .finish-btn, .restart-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s, transform 0.1s;
  }
  .reveal-btn:hover, .finish-btn:hover, .restart-btn:hover { background: #45392A; }
  .reveal-btn:active, .finish-btn:active, .restart-btn:active { transform: scale(0.98); }
  .finish-btn:disabled { background: var(--line); cursor: not-allowed; }
  .model-answer {
    display: none;
    margin-top: 12px;
    background: var(--gold-light);
    border-radius: 4px;
    padding: 12px 14px;
    font-size: 14px;
    color: #6B4E0C;
    border-inline-start: 3px solid var(--gold);
  }
  .rate-row { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
  .rate-btn {
    padding: 8px 14px;
    border-radius: 4px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
  }
  .rate-btn.active-2 { background: var(--good-light); border-color: var(--good); color: var(--good); }
  .rate-btn.active-0 { background: var(--bad-light); border-color: var(--bad); color: var(--bad); }
  .finish-wrap { text-align: center; margin: 34px 0; }
  .results-box {
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 5px solid var(--gold);
    border-radius: 4px;
    padding: 30px 24px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .results-box .big-score { font-size: 42px; font-weight: 700; font-family: "Frank Ruhl Libre", serif; color: var(--ink); margin: 8px 0; font-variant-numeric: tabular-nums; }
  .results-box .pct { font-size: 16px; color: var(--sub); margin-bottom: 4px; }
  .breakdown { text-align: right; margin-top: 20px; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 4px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .backlink { display: inline-block; margin-top: 20px; color: var(--sub); cursor: pointer; font-size: 13.5px; }
  .backlink:hover { color: var(--ink); text-decoration: underline; }

  /* ===== Timeline (tap-to-place) ===== */
  .tl-instructions {
    background: var(--paper-2);
    border-inline-start: 3px solid var(--gold);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 18px;
  }
  .tl-dir-hint {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--sub);
    font-weight: 700;
    padding: 0 4px;
    margin-bottom: 7px;
  }
  .tl-dir-hint span:first-child::before { content: "◄ "; }
  .tl-dir-hint span:last-child::after { content: " ►"; }
  .tl-scroll { overflow-x: auto; padding: 4px 4px 10px; }
  .tl-slots, .tl-bank { display: flex; gap: 10px; min-width: min-content; }
  .tl-slots { padding: 10px; background: var(--paper-2); border-radius: 6px; margin-bottom: 22px; border: 1px solid var(--line-soft); }
  .tl-bank { padding: 4px; }
  .tl-slot {
    flex: 0 0 132px;
    min-height: 74px;
    border: 2px dashed var(--line);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    font-size: 13px;
    font-weight: 700;
    background: var(--paper);
    transition: border-color 0.12s;
  }
  .tl-slot.empty.can-drop { border-color: var(--gold); background: var(--gold-light); cursor: pointer; }
  .tl-slot.filled { border-style: solid; border-color: var(--line-soft); padding: 0; background: transparent; }
  .tl-card {
    flex: 0 0 132px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    padding: 10px 10px 9px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    user-select: none;
    transition: all 0.12s;
    position: relative;
    box-shadow: var(--shadow);
  }
  .tl-card:hover { border-color: var(--gold); box-shadow: var(--shadow-lift); }
  .tl-card.selected { border-color: var(--gold); background: var(--gold-light); box-shadow: 0 0 0 3px var(--gold-light), var(--shadow-lift); }
  .tl-card.correct { border-color: var(--good); background: var(--good-light); }
  .tl-card.incorrect { border-color: var(--bad); background: var(--bad-light); }
  .tl-card-label { line-height: 1.35; }
  .tl-card-dates { margin-top: 5px; font-size: 11.5px; font-weight: 500; color: var(--sub); font-variant-numeric: tabular-nums; }
  .tl-card.correct .tl-card-dates, .tl-card.incorrect .tl-card-dates { color: inherit; }
  .tl-remove {
    position: absolute;
    top: -8px;
    inset-inline-start: -8px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    font-weight: 700;
  }
  .tl-remove:hover { background: var(--bad); }
  .tl-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
  .tl-result { text-align: center; margin-top: 18px; font-size: 17px; font-weight: 700; color: var(--ink); font-family: "Frank Ruhl Libre", serif; }

  /* ===== Kings Gantt ===== */
  .kg-legend { display: flex; justify-content: center; gap: 22px; margin-bottom: 4px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
  .kg-legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-inline-end: 6px; vertical-align: -1px; }
  .kg-source { text-align: center; font-size: 12.5px; color: var(--sub); margin: 6px 0 22px; }
  .kg-scroll { overflow-x: auto; padding-bottom: 6px; }
  .kg-chart { position: relative; padding: 4px 0 0; }
  .kg-axis { position: relative; height: 26px; border-bottom: 1.5px solid var(--line); margin-bottom: 6px; }
  .kg-axis .tick {
    position: absolute; top: 0; bottom: 0;
    border-inline-start: 1px solid var(--line-soft);
    font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums;
    padding-inline-start: 3px;
  }
  .kg-lane { position: relative; margin-bottom: 3px; }
  .kg-lane-label {
    position: sticky; inset-inline-start: 0;
    display: inline-block;
    font-size: 12px; font-weight: 700;
    color: var(--paper);
    padding: 2px 10px;
    border-radius: 3px;
    margin-bottom: 4px;
    z-index: 2;
  }
  .kg-lane-track { position: relative; }
  .kg-bar {
    position: absolute;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: white;
    overflow: hidden;
    white-space: nowrap;
    padding: 0 5px;
    border: 1px solid rgba(0,0,0,0.12);
    transition: filter 0.1s, box-shadow 0.1s;
  }
  .kg-bar:hover, .kg-bar.active { filter: brightness(1.08); box-shadow: var(--shadow-lift); z-index: 3; }
  .kg-bar.thin { font-size: 0; }
  .kg-bar.event-marker { background: var(--ink) !important; }
  .kg-detail {
    margin-top: 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-inline-start: 5px solid var(--gold);
    border-radius: 4px;
    padding: 16px 18px;
    display: none;
  }
  .kg-detail.show { display: block; }
  .kg-detail .kd-name { font-family: "Frank Ruhl Libre", serif; font-size: 18px; font-weight: 700; }
  .kg-detail .kd-years { font-size: 13.5px; color: var(--sub); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .kg-detail .kd-prophet { font-size: 13.5px; color: var(--gold); margin-top: 8px; }
  .united-strip { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 30px; }
  .united-item { background: var(--ink); color: var(--paper); border-radius: 4px; padding: 11px 20px; text-align: center; min-width: 110px; }
  .united-item .u-name { font-family: "Frank Ruhl Libre", serif; font-size: 15px; font-weight: 700; }
  .united-item .u-years { font-size: 12.5px; opacity: 0.8; margin-top: 2px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>ציר הזמן ההיסטורי — קורס מורי דרך</h1>
    <div class="sub">תיארוך, אירועים ודמויות: להבין מה קדם למה</div>
    <div id="scorebar"></div>
  </div>
</header>
<div class="ruler"></div>

<main id="app"></main>

<script>
const QUIZZES = {
  "prehistory_bronze": {
    title: "פרהיסטוריה ותקופת הברונזה",
    items: [
      { type: "mc", topic: "פרהיסטוריה", q: "איזו תקופה קדמה ישירות לתקופה הכלקוליתית?", options: ["ברזל א'", "הברונזה התיכונה", "הניאולית הקרמי", "הברונזה הקדומה"], correct: 2, exp: "הניאולית הקרמי (שבו הומצאו כלי החרס) קדם לכלקוליתית." },
      { type: "mc", topic: "פרהיסטוריה", q: "התקופה הניאוליתית הקדם-קרמית (א'+ב') מתוארכת בקירוב ל:", options: ["4,500–3,300 לפנה\"ס", "9,500–6,400 לפנה\"ס", "6,400–4,500 לפנה\"ס", "12,500–9,500 לפנה\"ס"], correct: 1, exp: "תקופת המהפכה החקלאית — ביות צמחים ובעלי חיים, טרם המצאת כלי החרס." },
      { type: "mc", topic: "תקופת הברונזה", q: "תקופת הברזל ב' (1000–586 לפנה\"ס) מקבילה בתקופה המקראית ל'ימי:", options: ["בית ראשון'", "השופטים'", "בית שני'", "האבות'"], correct: 0, exp: "בית המקדש הראשון עמד ברציפות בתוך טווח הברזל ב'." },
      { type: "fill", topic: "פרהיסטוריה", q: "התקופה שקדמה ישירות לברונזה הקדומה נקראת ___________________________", answer: "כלקוליתית", exp: "התקופה הכלקוליתית (4,500–3,300 לפנה\"ס) קדמה לברונזה הקדומה." },
      { type: "mc", topic: "תקופת הברונזה", q: "מכתבי אל-עמארנה, המתעדים את כנען תחת שלטון מצרי אימפריאלי, שייכים לתקופת:", options: ["ברזל ב'", "הברונזה התיכונה", "הברונזה המאוחרת", "ברזל א'"], correct: 2, exp: "המכתבים מהמאה ה-14 לפנה\"ס, בתוך תקופת השלטון המצרי." },
      { type: "mc", topic: "פרהיסטוריה", q: "התקופה הכלקוליתית מתוארכת בקירוב ל:", options: ["4,500–3,300 לפנה\"ס", "2,300–2,000 לפנה\"ס", "6,400–4,500 לפנה\"ס", "1,550–1,200 לפנה\"ס"], correct: 0, exp: "תקופת ראשית חרושת המתכת (הנחושת) ומורכבות חברתית גוברת." },
      { type: "mc", topic: "תקופת הברונזה", q: "תקופת הברזל א' (1200–1000 לפנה\"ס) מקבילה בתקופה המקראית ל'תקופת:", options: ["השופטים'", "בית שני'", "האבות'", "בית ראשון'"], correct: 0, exp: "תקופת ההתנחלות והשופטים, לפי המקרא, קודמת לממלכה המאוחדת." },

const app = document.getElementById("app");
const scorebar = document.getElementById("scorebar");

let mode = null; // "home" | "quiz" | "timeline" | "kings"
let quizState = { key: null, mcAnswers: {}, fillRatings: {} };
let timelineState = { key: null, slots: [], bank: [], selected: null, checked: false };

function topicBucket(t) {
  const i = t.indexOf(" — ");
  return i === -1 ? t : t.slice(0, i);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

/* ============================= Quiz engine ============================= */

function computeQuizScore(key) {
  const quiz = QUIZZES[key];
  let earned = 0, possible = quiz.items.length * 2;
  quiz.items.forEach((item, i) => {
    if (item.type === "mc") {
      if (quizState.mcAnswers[i] !== undefined && quizState.mcAnswers[i] === item.correct) earned += 2;
    } else {
      if (quizState.fillRatings[i] !== undefined) earned += quizState.fillRatings[i];
    }
  });
  return { earned, possible };
}

function updateScorebar() {
  if (mode === "quiz" && quizState.key !== null) {
    const { earned, possible } = computeQuizScore(quizState.key);
    scorebar.style.display = "block";
    scorebar.textContent = "ציון נוכחי: " + earned + " / " + possible + " נקודות";
  } else {
    scorebar.style.display = "none";
  }
}

function renderQuizSelect() {
  mode = "quiz";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "select-screen";
  wrap.innerHTML = "<h2>שאלוני תיארוך</h2><div class=\"lede\">בחרו נושא — כל שאלון משלב שאלות אמריקאיות והשלמת מקום על תאריכים, סדר אירועים ותקופות מקבילות</div>";
  Object.keys(QUIZZES).forEach((key) => {
    const q = QUIZZES[key];
    const btn = document.createElement("button");
    btn.className = "topic-btn";
    const mcN = q.items.filter((i) => i.type === "mc").length;
    const fillN = q.items.length - mcN;
    btn.innerHTML = '<span class="tb-title">' + q.title + '</span><span class="tb-sub">' + q.items.length + ' שאלות (' + mcN + ' אמריקאיות + ' + fillN + ' השלמת מקום) — ' + (q.items.length * 2) + " נק'</span>";
    btn.onclick = () => renderQuiz(key);
    wrap.appendChild(btn);
  });
  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = renderHome;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  wrap.appendChild(centerWrap);
  app.appendChild(wrap);
}

function renderQuiz(key) {
  quizState = { key, mcAnswers: {}, fillRatings: {} };
  mode = "quiz";
  const quiz = QUIZZES[key];
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.textContent = quiz.title;
  app.appendChild(h);

  quiz.items.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qtopic">' + item.topic + '</div><div class="qtext">' + (i + 1) + '. ' + item.q + '</div>';

    if (item.type === "mc") {
      const optWrap = document.createElement("div");
      const letters = ["א", "ב", "ג", "ד"];
      item.options.forEach((opt, oi) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = letters[oi] + ". " + opt;
        b.onclick = () => {
          if (quizState.mcAnswers[i] !== undefined) return;
          quizState.mcAnswers[i] = oi;
          const btns = optWrap.querySelectorAll(".opt");
          btns.forEach((bb, bi) => {
            bb.classList.add("locked");
            if (bi === item.correct) bb.classList.add("correct");
            else if (bi === oi) bb.classList.add("incorrect");
          });
          card.querySelector(".explain").style.display = "block";
          updateScorebar();
        };
        optWrap.appendChild(b);
      });
      card.appendChild(optWrap);
      const exp = document.createElement("div");
      exp.className = "explain";
      exp.textContent = item.exp;
      card.appendChild(exp);
    } else {
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "fill-input";
      inp.placeholder = "הקלידו את תשובתכם (רשות)...";
      card.appendChild(inp);

      const revealBtn = document.createElement("button");
      revealBtn.className = "reveal-btn";
      revealBtn.textContent = "בדוק תשובה";
      const answerDiv = document.createElement("div");
      answerDiv.className = "model-answer";
      answerDiv.innerHTML = "<strong>תשובה נכונה:</strong> " + item.answer + "<br>" + item.exp;
      const rateRow = document.createElement("div");
      rateRow.className = "rate-row";
      rateRow.style.display = "none";
      const ratings = [["ידעתי (2)", 2], ["לא ידעתי (0)", 0]];
      ratings.forEach(([label, val]) => {
        const rb = document.createElement("button");
        rb.className = "rate-btn";
        rb.textContent = label;
        rb.onclick = () => {
          quizState.fillRatings[i] = val;
          rateRow.querySelectorAll(".rate-btn").forEach((x) => { x.className = "rate-btn"; });
          rb.classList.add("active-" + val);
          updateScorebar();
        };
        rateRow.appendChild(rb);
      });
      revealBtn.onclick = () => {
        answerDiv.style.display = "block";
        rateRow.style.display = "flex";
        revealBtn.style.display = "none";
      };
      card.appendChild(revealBtn);
      card.appendChild(answerDiv);
      card.appendChild(rateRow);
    }
    app.appendChild(card);
  });

  const finishWrap = document.createElement("div");
  finishWrap.className = "finish-wrap";
  const finishBtn = document.createElement("button");
  finishBtn.className = "finish-btn";
  finishBtn.textContent = "סיים שאלון והצג ציון סופי";
  finishBtn.onclick = () => renderQuizResults(key);
  finishWrap.appendChild(finishBtn);
  app.appendChild(finishWrap);

  updateScorebar();
  window.scrollTo(0, 0);
}

function renderQuizResults(key) {
  const quiz = QUIZZES[key];
  const { earned, possible } = computeQuizScore(key);
  const pct = Math.round((earned / possible) * 100);

  const topics = {};
  quiz.items.forEach((item, i) => {
    const bucket = topicBucket(item.topic);
    topics[bucket] = topics[bucket] || { earned: 0, possible: 0 };
    topics[bucket].possible += 2;
    if (item.type === "mc") {
      if (quizState.mcAnswers[i] === item.correct) topics[bucket].earned += 2;
    } else {
      topics[bucket].earned += quizState.fillRatings[i] || 0;
    }
  });

  app.innerHTML = "";
  const box = document.createElement("div");
  box.className = "results-box";
  let rows = "";
  Object.keys(topics).forEach((t) => {
    rows += '<div class="breakdown-row"><span>' + t + '</span><span>' + topics[t].earned + ' / ' + topics[t].possible + '</span></div>';
  });
  box.innerHTML =
    '<div>סיימתם את ' + quiz.title + '</div>' +
    '<div class="big-score">' + earned + ' / ' + possible + '</div>' +
    '<div class="pct">' + pct + '% הצלחה</div>' +
    '<div class="breakdown">' + rows + '</div>';
  app.appendChild(box);

  const restart = document.createElement("button");
  restart.className = "restart-btn";
  restart.textContent = "חזרה לבחירת שאלון";
  restart.onclick = renderQuizSelect;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(restart);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

/* ============================= Timeline (tap-to-place) engine ============================= */

function renderTimelineSelect() {
  mode = "timeline";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "select-screen";
  wrap.innerHTML = "<h2>ציר זמן גרירה</h2><div class=\"lede\">בחרו ציר זמן — הקישו על פריט ואז על מקומו הכרונולוגי, ובדקו את הסדר</div>";
  Object.keys(TIMELINES).forEach((key) => {
    const t = TIMELINES[key];
    const btn = document.createElement("button");
    btn.className = "topic-btn";
    btn.innerHTML = '<span class="tb-title">' + t.title + '</span><span class="tb-sub">' + t.nodes.length + ' פריטים לסידור</span>';
    btn.onclick = () => renderTimeline(key);
    wrap.appendChild(btn);
  });
  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = renderHome;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  wrap.appendChild(centerWrap);
  app.appendChild(wrap);
}

function renderTimeline(key) {
  mode = "timeline";
  const t = TIMELINES[key];
  const bank = t.nodes.map((_, i) => i);
  shuffleArray(bank);
  timelineState = { key, slots: new Array(t.nodes.length).fill(null), bank, selected: null, checked: false };
  updateScorebar();
  drawTimeline();
}

function placeInSlot(idx, slotIndex) {
  if (timelineState.checked) return;
  if (timelineState.slots[slotIndex] !== null) return;
  timelineState.bank = timelineState.bank.filter((v) => v !== idx);
  timelineState.slots[slotIndex] = idx;
  timelineState.selected = null;
  drawTimeline();
}

function returnToBank(slotIndex) {
  if (timelineState.checked) return;
  const idx = timelineState.slots[slotIndex];
  if (idx === null) return;
  timelineState.slots[slotIndex] = null;
  timelineState.bank.push(idx);
  timelineState.selected = null;
  drawTimeline();
}

function buildTlCard(idx, slotIndex) {
  const card = document.createElement("div");
  card.className = "tl-card";
  if (timelineState.selected === idx) card.classList.add("selected");
  if (timelineState.checked && slotIndex !== null) {
    card.classList.add(idx === slotIndex ? "correct" : "incorrect");
  }
  const t = TIMELINES[timelineState.key];
  const node = t.nodes[idx];
  const label = document.createElement("div");
  label.className = "tl-card-label";
  label.textContent = node.label;
  card.appendChild(label);
  if (timelineState.checked) {
    const dates = document.createElement("div");
    dates.className = "tl-card-dates";
    dates.textContent = node.dates;
    card.appendChild(dates);
  }
  if (slotIndex !== null && !timelineState.checked) {
    const rm = document.createElement("div");
    rm.className = "tl-remove";
    rm.textContent = "✕";
    rm.title = "החזירו לרשימה";
    rm.onclick = (e) => { e.stopPropagation(); returnToBank(slotIndex); };
    card.appendChild(rm);
  }
  card.onclick = (e) => {
    e.stopPropagation();
    if (timelineState.checked) return;
    if (slotIndex !== null) {
      returnToBank(slotIndex);
    } else {
      timelineState.selected = timelineState.selected === idx ? null : idx;
      drawTimeline();
    }
  };
  return card;
}

function drawTimeline() {
  const t = TIMELINES[timelineState.key];
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.textContent = t.title;
  app.appendChild(h);

  const instr = document.createElement("div");
  instr.className = "tl-instructions";
  instr.textContent = timelineState.selected === null
    ? "הקישו על אחד הפריטים למטה, ואז הקישו על התא בציר שבו הוא צריך להיות."
    : "עכשיו הקישו על התא הריק בציר שבו הפריט שנבחר צריך להיות (או הקישו עליו שוב לביטול הבחירה).";
  app.appendChild(instr);

  const dirHint = document.createElement("div");
  dirHint.className = "tl-dir-hint";
  dirHint.innerHTML = "<span>המוקדם ביותר</span><span>המאוחר ביותר</span>";
  app.appendChild(dirHint);

  const slotsScroll = document.createElement("div");
  slotsScroll.className = "tl-scroll";
  const slotsWrap = document.createElement("div");
  slotsWrap.className = "tl-slots";
  timelineState.slots.forEach((val, i) => {
    const slot = document.createElement("div");
    slot.className = "tl-slot" + (val === null ? " empty" : " filled");
    if (val === null) {
      if (timelineState.selected !== null) slot.classList.add("can-drop");
      slot.textContent = String(i + 1);
    } else {
      slot.appendChild(buildTlCard(val, i));
    }
    slot.onclick = () => {
      if (timelineState.checked) return;
      if (val === null && timelineState.selected !== null) {
        placeInSlot(timelineState.selected, i);
      }
    };
    slotsWrap.appendChild(slot);
  });
  slotsScroll.appendChild(slotsWrap);
  app.appendChild(slotsScroll);

  const bankScroll = document.createElement("div");
  bankScroll.className = "tl-scroll";
  const bankWrap = document.createElement("div");
  bankWrap.className = "tl-bank";
  if (timelineState.bank.length === 0) {
    const done = document.createElement("div");
    done.style.color = "var(--sub)";
    done.style.fontSize = "13px";
    done.style.padding = "8px 4px";
    done.textContent = timelineState.checked ? "" : "כל הפריטים מוקמו — לחצו 'בדוק סדר'.";
    bankWrap.appendChild(done);
  } else {
    timelineState.bank.forEach((idx) => {
      bankWrap.appendChild(buildTlCard(idx, null));
    });
  }
  bankScroll.appendChild(bankWrap);
  app.appendChild(bankScroll);

  const controls = document.createElement("div");
  controls.className = "tl-controls";
  if (!timelineState.checked) {
    const checkBtn = document.createElement("button");
    checkBtn.className = "finish-btn";
    checkBtn.textContent = "בדוק סדר";
    checkBtn.disabled = timelineState.bank.length > 0;
    checkBtn.onclick = () => {
      if (timelineState.bank.length > 0) return;
      timelineState.checked = true;
      drawTimeline();
    };
    controls.appendChild(checkBtn);
  }
  const resetBtn = document.createElement("button");
  resetBtn.className = "restart-btn";
  resetBtn.textContent = "התחל מחדש";
  resetBtn.onclick = () => renderTimeline(timelineState.key);
  controls.appendChild(resetBtn);
  const backBtn = document.createElement("button");
  backBtn.className = "restart-btn";
  backBtn.textContent = "חזרה לבחירת ציר זמן";
  backBtn.onclick = renderTimelineSelect;
  controls.appendChild(backBtn);
  app.appendChild(controls);

  if (timelineState.checked) {
    const correctCount = timelineState.slots.filter((v, i) => v === i).length;
    const resultMsg = document.createElement("div");
    resultMsg.className = "tl-result";
    resultMsg.textContent = correctCount + " מתוך " + t.nodes.length + " במקום הכרונולוגי הנכון";
    app.appendChild(resultMsg);
  }
  window.scrollTo(0, 0);
}

  app.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "section-sub";
  sub.style.textAlign = "center";
  sub.textContent = "כל השנים לפני הספירה — הקישו על מלך לפרטים";
  app.appendChild(sub);

  const strip = document.createElement("div");
  strip.className = "united-strip";
  KINGS_GANTT.united.forEach((k) => {
    const item = document.createElement("div");
    item.className = "united-item";
    item.innerHTML = '<div class="u-name">' + k.name + '</div><div class="u-years">' + k.start + '–' + k.end + ' לפנה"ס</div>';
    strip.appendChild(item);
  });
  app.appendChild(strip);

  const legend = document.createElement("div");
  legend.className = "kg-legend";
  legend.innerHTML =
    '<span><span class="dot" style="background:var(--judah)"></span>מלכי יהודה</span>' +
    '<span><span class="dot" style="background:var(--israel)"></span>מלכי ישראל</span>' +
    '<span><span class="dot" style="background:var(--ink)"></span>אירוע (חורבן)</span>';
  app.appendChild(legend);

  const scroll = document.createElement("div");
  scroll.className = "kg-scroll";
  const chart = document.createElement("div");
  chart.className = "kg-chart";

  const AXIS_START = KINGS_GANTT.axisStart;
  const AXIS_END = KINGS_GANTT.axisEnd;
  const SCALE = 6.2;
  const totalYears = AXIS_START - AXIS_END;
  const chartWidth = Math.round(totalYears * SCALE) + 30;
  chart.style.width = chartWidth + "px";

  function xRight(year) { return Math.round((AXIS_START - year) * SCALE); }

  const axis = document.createElement("div");
  axis.className = "kg-axis";
  for (let y = Math.floor(AXIS_START / 50) * 50; y >= AXIS_END - 50; y -= 50) {
    if (y > AXIS_START) continue;
    const tick = document.createElement("div");
    tick.className = "tick";
    tick.style.right = xRight(y) + "px";
    tick.textContent = y > 0 ? y : -y;
    axis.appendChild(tick);
  }
  chart.appendChild(axis);

  const detail = document.createElement("div");
  detail.className = "kg-detail";

  function showKingDetail(k, kingdom) {
    detail.classList.add("show");
    const yearCount = k.start - k.end;
    const yearWord = yearCount === 1 ? "שנה אחת" : yearCount === 2 ? "שנתיים" : yearCount + " שנים";
    const years = k.start === k.end ? (k.start + ' לפנה"ס') : (k.start + '–' + k.end + ' לפנה"ס (' + yearWord + ')');
    detail.innerHTML =
      '<div class="kd-name">' + k.name + ' <span style="font-size:13px;color:var(--sub);font-weight:400">— ' + kingdom + '</span></div>' +
      '<div class="kd-years">' + years + '</div>' +
      (k.prophet ? '<div class="kd-prophet">נביאים בני התקופה: ' + k.prophet + '</div>' : '');
  }

  function buildLane(title, colorVar, kings, rows) {
    const lane = document.createElement("div");
    lane.className = "kg-lane";
    const label = document.createElement("div");
    label.className = "kg-lane-label";
    label.textContent = title;
    label.style.background = colorVar;
    lane.appendChild(label);
    const track = document.createElement("div");
    track.className = "kg-lane-track";
    track.style.height = (rows * 34 + 6) + "px";
    kings.forEach((k) => {
      const bar = document.createElement("div");
      bar.className = "kg-bar" + (k.isEvent ? " event-marker" : "");
      const trueWidth = (k.start - k.end) * SCALE;
      const width = Math.max(trueWidth, k.isEvent ? 7 : 3);
      bar.style.width = width + "px";
      bar.style.right = xRight(k.start) + "px";
      bar.style.top = ((k.row || 0) * 34) + "px";
      bar.style.height = "28px";
      bar.style.zIndex = width < 10 ? 4 : 1;
      if (!k.isEvent) bar.style.background = colorVar;
      if (width < 46 && !k.isEvent) bar.classList.add("thin");
      else bar.textContent = k.name;
      bar.title = k.name + " (" + (k.start === k.end ? k.start : k.start + "–" + k.end) + " לפנה\"ס)" + (k.prophet ? " — נביא: " + k.prophet : "");
      bar.onclick = () => {
        chart.querySelectorAll(".kg-bar.active").forEach((b) => b.classList.remove("active"));
        bar.classList.add("active");
        showKingDetail(k, title);
      };
      track.appendChild(bar);
    });
    lane.appendChild(track);
    return lane;
  }

  chart.appendChild(buildLane("יהודה", "var(--judah)", KINGS_GANTT.judah, 2));
  chart.appendChild(buildLane("ישראל", "var(--israel)", KINGS_GANTT.israel, 1));

  scroll.appendChild(chart);
  app.appendChild(scroll);
  app.appendChild(detail);

  const src = document.createElement("div");
  src.className = "kg-source";
  src.textContent = KINGS_GANTT.source;
  app.appendChild(src);

  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = renderHome;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

/* ============================= Home ============================= */

function renderHome() {
  mode = "home";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");

  const intro = document.createElement("div");
  intro.className = "home-hero";
  const stripColors = ["var(--line)", "var(--line)", "var(--judah-dim)", "var(--judah-dim)", "var(--judah)", "var(--gold)", "var(--gold)", "var(--israel-dim)", "var(--israel)", "var(--israel)", "var(--ink)", "var(--gold)", "var(--judah)", "var(--israel)", "var(--gold)", "var(--ink)"];
  let stripHtml = '<div class="hero-strip">' + stripColors.map((c) => '<span style="background:' + c + '"></span>').join("") + '</div>';
  intro.innerHTML = stripHtml + "<h2>מה קדם למה?</h2><p>שלושה כלי תרגול שמתמקדים אך ורק בציר הזמן ההיסטורי — תיארוך תקופות ואירועים, סדר כרונולוגי, ותקופות מקבילות.</p>";
  wrap.appendChild(intro);

  const grid = document.createElement("div");
  grid.className = "mode-grid";

  const cards = [
    { glyph: "📅", title: "שאלוני תיארוך", desc: "מתי הייתה כל תקופה, מה קרה קודם, ואיזו תקופה מקבילה לאיזו — לפי נושא.", fn: renderQuizSelect },
    { glyph: "🧭", title: "ציר זמן גרירה", desc: "הציבו תקופות, אירועים ודמויות במקומם הכרונולוגי הנכון על ציר הזמן.", fn: renderTimelineSelect },
    { glyph: "👑", title: "מלכי ישראל ויהודה", desc: "גרף זמן מלא: כל המלכים על ציר משותף, לפי שנות מלכותם והנביאים בני זמנם.", fn: renderKingsTable },
  ];
  cards.forEach((c) => {
    const card = document.createElement("div");
    card.className = "mode-card";
    card.innerHTML = '<div class="glyph">' + c.glyph + '</div><h3>' + c.title + '</h3><p>' + c.desc + '</p>';
    card.onclick = c.fn;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  app.appendChild(wrap);
}

renderHome();

</script>
</body>
</html>
