<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ציר הזמן ההיסטורי — מורי דרך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2ede1;
    --bg-glow-1: rgba(168,105,15,.14);
    --bg-glow-2: rgba(31,122,103,.10);
    --surface: #fffdf8;
    --card: rgba(32,26,17,.035);
    --card-2: rgba(32,26,17,.065);
    --line: rgba(32,26,17,.13);
    --line-soft: rgba(32,26,17,.09);
    --ink: #211a10;
    --sub: #6d6252;
    --title-1: #201a10;
    --title-2: #a8690f;
    --judah: #b5541c;
    --judah-soft: rgba(181,84,28,.13);
    --israel: #1f7a67;
    --israel-soft: rgba(31,122,103,.13);
    --gold: #a8690f;
    --gold-soft: rgba(168,105,15,.14);
    --good: #1f8a4c;
    --good-soft: rgba(31,138,76,.13);
    --bad: #c23b2e;
    --bad-soft: rgba(194,59,46,.12);
    --on-accent: #fffaf0;
    --shadow: 0 6px 18px -10px rgba(32,26,17,.28);
    --shadow-lift: 0 18px 36px -16px rgba(32,26,17,.4);
    --r-lg: 24px;
    --r-md: 16px;
    --r-sm: 11px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Heebo", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0 0 90px;
    line-height: 1.6;
  }
  h1, h2, h3, .display { font-family: "Heebo", Arial, sans-serif; font-weight: 800; text-wrap: balance; letter-spacing: -0.01em; }
  button, input { font-family: "Heebo", Arial, sans-serif; }
  :focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

  header {
    position: relative;
    background: var(--ink);
    color: var(--on-accent);
    overflow: hidden;
  }
  header::before, header::after {
    content: "";
    position: absolute;
    width: 280px; height: 280px;
    border-radius: 50%;
    filter: blur(50px);
    pointer-events: none;
  }
  header::before { top: -140px; inset-inline-end: -60px; background: rgba(168,105,15,.35); }
  header::after { bottom: -160px; inset-inline-start: 10%; background: rgba(31,122,103,.28); }
  .header-inner { position: relative; max-width: 900px; margin: 0 auto; padding: 22px 24px 20px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  header h1 { margin: 0 0 5px; font-size: 21px; font-weight: 800; }
  header .sub { font-size: 13px; opacity: 0.7; font-weight: 500; }
  .home-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,250,240,0.1);
    border: 1.5px solid rgba(255,250,240,0.26);
    color: var(--on-accent);
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
    white-space: nowrap;
  }
  .home-btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .home-btn:hover { background: rgba(255,250,240,0.2); border-color: rgba(255,250,240,0.5); }
  .home-btn:active { transform: scale(0.96); }
  #scorebar {
    display: none;
    margin-top: 12px;
    font-size: 13.5px;
    font-weight: 700;
    background: rgba(255,250,240,0.12);
    border: 1px solid rgba(255,250,240,0.18);
    border-radius: 999px;
    padding: 7px 16px;
    width: fit-content;
    font-variant-numeric: tabular-nums;
  }
  .header-band {
    position: relative;
    height: 4px;
    background: linear-gradient(90deg, var(--judah), var(--gold), var(--israel));
  }
  main { max-width: 900px; margin: 0 auto; padding: 36px 18px; }

  /* ===== Buttons (shared) ===== */
  .btn-primary, .finish-btn, .reveal-btn {
    background: linear-gradient(135deg, var(--judah), var(--gold));
    color: var(--on-accent);
    border: none;
    border-radius: 999px;
    padding: 13px 26px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 22px -12px var(--judah);
    transition: transform 0.14s, box-shadow 0.14s, filter 0.14s;
  }
  .btn-primary:hover, .finish-btn:hover, .reveal-btn:hover { filter: brightness(1.05); box-shadow: 0 12px 26px -10px var(--judah); }
  .btn-primary:active, .finish-btn:active, .reveal-btn:active { transform: scale(0.96); }
  .finish-btn:disabled { background: var(--card-2); color: var(--sub); box-shadow: none; cursor: not-allowed; filter: none; }
  .restart-btn {
    background: var(--surface);
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 13px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.14s, background 0.14s, transform 0.12s;
  }
  .restart-btn:hover { border-color: var(--gold); background: var(--gold-soft); }
  .restart-btn:active { transform: scale(0.96); }

  /* ===== Home ===== */
  .home-hero { position: relative; text-align: center; margin-bottom: 40px; padding-top: 6px; }
  .home-hero::before {
    content: "";
    position: absolute;
    top: -30px; left: 50%; transform: translateX(-50%);
    width: 420px; height: 220px;
    background: radial-gradient(closest-side, var(--bg-glow-1), transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  .hero-strip {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .hero-strip span {
    display: inline-block;
    width: 26px; height: 7px;
    border-radius: 99px;
  }
  .home-hero h2 {
    font-size: 32px; margin: 0 0 12px; font-weight: 800;
    background: linear-gradient(100deg, var(--title-1), var(--title-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .home-hero p { color: var(--sub); font-size: 15.5px; max-width: 540px; margin: 0 auto; }
  .mode-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 640px) { .mode-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .mode-card {
    position: relative;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 24px 22px;
    text-align: right;
    cursor: pointer;
    transition: transform 0.16s, box-shadow 0.16s, border-color 0.16s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .mode-card::after {
    content: "";
    position: absolute;
    inset-inline-end: -34px; top: -34px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: var(--mc, var(--gold));
    opacity: 0.16;
    filter: blur(4px);
  }
  .mode-card:hover { box-shadow: var(--shadow-lift); transform: translateY(-4px); border-color: var(--mc, var(--gold)); }
  .mode-card .icon-badge {
    width: 48px; height: 48px;
    border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--mc, var(--gold)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--mc, var(--gold)) 32%, transparent);
    color: var(--mc, var(--gold));
  }
  .mode-card .icon-badge svg { width: 24px; height: 24px; }
  .mode-card h3 { margin: 0; font-size: 17.5px; color: var(--ink); font-weight: 700; }
  .mode-card p { margin: 0; font-size: 13.5px; color: var(--sub); line-height: 1.5; }

  /* ===== Section select screens ===== */
  .select-screen { text-align: center; padding: 4px 16px; }
  .select-screen h2 { font-size: 25px; margin: 0 0 8px; color: var(--ink); font-weight: 800; }
  .select-screen .lede { color: var(--sub); font-size: 14.5px; margin-bottom: 30px; max-width: 520px; margin-inline: auto; }
  .topic-btn {
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto 12px;
    padding: 15px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    cursor: pointer;
    color: var(--ink);
    transition: all 0.15s;
    text-align: right;
    box-shadow: var(--shadow);
  }
  .topic-btn:hover { border-color: var(--gold); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  .topic-btn .tb-badge {
    flex: 0 0 40px;
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--gold-soft);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .topic-btn .tb-text { flex: 1; min-width: 0; }
  .topic-btn .tb-title { display: block; font-size: 16.5px; font-weight: 700; color: var(--ink); }
  .topic-btn .tb-sub { display: block; font-size: 12.5px; color: var(--sub); font-weight: 400; margin-top: 4px; }

  /* ===== Quiz cards ===== */
  .section-title { font-size: 22px; font-weight: 800; margin: 30px 0 4px; color: var(--ink); }
  .section-sub { font-size: 13.5px; color: var(--sub); margin: 0 0 24px; }
  .qcard {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 20px 22px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .qtopic {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 10px;
  }
  .qtext { font-size: 15.5px; font-weight: 700; margin-bottom: 14px; }
  .opt {
    display: block;
    width: 100%;
    text-align: right;
    padding: 12px 16px;
    margin-bottom: 8px;
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    font-size: 14.5px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.12s;
  }
  .opt:hover:not(.locked) { border-color: var(--gold); background: var(--gold-soft); }
  .opt.correct { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 700; }
  .opt.incorrect { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .opt.locked { cursor: default; }
  .explain {
    margin-top: 12px;
    font-size: 13px;
    color: var(--sub);
    background: var(--card);
    border-radius: var(--r-sm);
    padding: 12px 14px;
    display: none;
    border-inline-start: 3px solid var(--gold);
  }
  .fill-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    font-size: 14.5px;
    margin-bottom: 10px;
    font-family: inherit;
    background: var(--surface);
    color: var(--ink);
  }
  .fill-input:focus { border-color: var(--gold); outline: none; }
  .model-answer {
    display: none;
    margin-top: 12px;
    background: var(--gold-soft);
    border-radius: var(--r-sm);
    padding: 13px 15px;
    font-size: 14px;
    color: #6B4E0C;
    border-inline-start: 3px solid var(--gold);
  }
  .rate-row { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
  .rate-btn {
    padding: 9px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: all 0.12s;
  }
  .rate-btn.active-2 { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .rate-btn.active-0 { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .finish-wrap { text-align: center; margin: 34px 0; }
  .results-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 32px 24px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .results-box .big-score { font-size: 44px; font-weight: 800; color: var(--ink); margin: 8px 0; font-variant-numeric: tabular-nums; }
  .results-box .pct { font-size: 16px; color: var(--sub); margin-bottom: 4px; }
  .breakdown { text-align: right; margin-top: 22px; }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 6px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .backlink { display: inline-block; margin-top: 20px; color: var(--sub); cursor: pointer; font-size: 13.5px; }
  .backlink:hover { color: var(--ink); text-decoration: underline; }

  /* ===== Timeline (tap-to-place) ===== */
  .tl-instructions {
    background: var(--card);
    border-inline-start: 3px solid var(--gold);
    border-radius: var(--r-sm);
    padding: 11px 15px;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 18px;
  }
  .tl-dir-hint {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--sub);
    font-weight: 700;
    padding: 0 4px;
    margin-bottom: 7px;
  }
  .tl-dir-hint span:first-child::before { content: "◄ "; }
  .tl-dir-hint span:last-child::after { content: " ►"; }
  .tl-scroll { overflow-x: auto; padding: 4px 4px 10px; }
  .tl-slots, .tl-bank { display: flex; gap: 10px; min-width: min-content; }
  .tl-slots { padding: 12px; background: var(--card); border-radius: var(--r-md); margin-bottom: 22px; border: 1px solid var(--line-soft); }
  .tl-bank { padding: 4px; }
  .tl-slot {
    flex: 0 0 132px;
    min-height: 76px;
    border: 2px dashed var(--line);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
    font-size: 13px;
    font-weight: 700;
    background: var(--surface);
    transition: border-color 0.12s, background 0.12s;
  }
  .tl-slot.empty.can-drop { border-color: var(--gold); background: var(--gold-soft); cursor: pointer; }
  .tl-slot.filled { border-style: solid; border-color: var(--line-soft); padding: 0; background: transparent; }
  .tl-card {
    flex: 0 0 132px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 11px 11px 10px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    user-select: none;
    transition: all 0.12s;
    position: relative;
    box-shadow: var(--shadow);
  }
  .tl-card:hover { border-color: var(--gold); box-shadow: var(--shadow-lift); }
  .tl-card.selected { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow-lift); }
  .tl-card.correct { border-color: var(--good); background: var(--good-soft); }
  .tl-card.incorrect { border-color: var(--bad); background: var(--bad-soft); }
  .tl-card-label { line-height: 1.35; }
  .tl-card-dates { margin-top: 5px; font-size: 11.5px; font-weight: 500; color: var(--sub); font-variant-numeric: tabular-nums; }
  .tl-card.correct .tl-card-dates, .tl-card.incorrect .tl-card-dates { color: inherit; }
  .tl-remove {
    position: absolute;
    top: -8px;
    inset-inline-start: -8px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--on-accent);
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    font-weight: 700;
  }
  .tl-remove:hover { background: var(--bad); }
  .tl-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
  .tl-result { text-align: center; margin-top: 18px; font-size: 17px; font-weight: 800; color: var(--ink); }

  /* ===== Kings Gantt (vertical) ===== */
  .kg-legend { display: flex; justify-content: center; gap: 22px; margin-bottom: 6px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
  .kg-legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-inline-end: 6px; vertical-align: -1px; }
  .kg-source { text-align: center; font-size: 12.5px; color: var(--sub); margin: 8px 0 22px; }
  .kg-vwrap { max-width: 620px; margin: 0 auto; }
  .kg-vheads {
    display: grid;
    grid-template-columns: 1fr 60px 1fr;
    align-items: center;
    margin-bottom: 10px;
  }
  .kg-vhead {
    display: inline-flex;
    justify-self: center;
    align-items: center;
    gap: 7px;
    font-size: 14.5px;
    font-weight: 800;
    padding: 6px 16px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--kc) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--kc) 30%, transparent);
    color: var(--kc);
  }
  .kg-vhead .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--kc); }
  .kg-vbody { position: relative; }
  .kg-vgridline {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px dashed var(--line-soft);
  }
  .kg-vtick {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    text-align: center;
    font-size: 10.5px;
    color: var(--sub);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: var(--bg);
    z-index: 2;
  }
  .kg-vcol {
    position: absolute;
    top: 0;
    width: calc(50% - 58px);
    height: 100%;
  }
  .kg-vcol-judah { right: 0; }
  .kg-vcol-israel { left: 0; }
  .kg-vaxis { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 100%; }
  .kg-vbar {
    position: absolute;
    right: 0; left: 0;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--on-accent);
    overflow: hidden;
    padding: 1px 7px;
    border: 1px solid rgba(0,0,0,0.1);
    box-shadow: 0 2px 6px -3px rgba(32,26,17,.35);
    transition: filter 0.1s, box-shadow 0.1s;
  }
  .kg-vbar:hover, .kg-vbar.active { filter: brightness(1.08); box-shadow: var(--shadow-lift); z-index: 8 !important; }
  .kg-vbar.thin { padding: 0; border-radius: 4px; }
  .kg-vbar.event-marker { background: var(--ink) !important; }
  .kg-vbar.co-regent {
    width: 46%;
    right: auto;
    left: 0;
    border-style: dashed;
    box-shadow: -2px 0 0 var(--bg);
  }
  .kg-vbar.important { outline: 2.5px solid var(--gold); outline-offset: 1.5px; }
  .kv-name { font-size: 11.5px; font-weight: 700; }
  .kv-prophet { font-size: 9.5px; font-weight: 500; opacity: 0.88; margin-top: 1px; }
  .kg-prophet-pill {
    position: absolute;
    transform: translateY(-50%);
    font-size: 9px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border: 1px solid color-mix(in srgb, var(--gold) 38%, transparent);
    border-radius: 999px;
    padding: 2.5px 8px;
    max-width: 50px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    z-index: 6;
    cursor: default;
  }
  .kg-prophet-pill-judah { left: 50%; margin-left: 6px; }
  .kg-prophet-pill-israel { right: 50%; margin-right: 6px; }
  .kg-prophet-pill-legend {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border: 1px solid color-mix(in srgb, var(--gold) 38%, transparent);
    border-radius: 999px;
    padding: 2px 8px;
    margin-inline-end: 6px;
    vertical-align: 1px;
  }
  .kd-important {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 2px 10px;
    margin-inline-start: 6px;
    vertical-align: middle;
  }
  .kg-detail {
    margin-top: 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 18px 20px;
    display: none;
    box-shadow: var(--shadow);
  }
  .kg-detail.show { display: block; }
  .kg-detail .kd-name { font-size: 18px; font-weight: 800; }
  .kg-detail .kd-years { font-size: 13.5px; color: var(--sub); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .kg-detail .kd-prophet { font-size: 13.5px; color: var(--gold); margin-top: 8px; font-weight: 600; }
  .united-strip { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 30px; }

const app = document.getElementById("app");
const scorebar = document.getElementById("scorebar");

let mode = null; // "home" | "quiz" | "timeline" | "kings"
let quizState = { key: null, mcAnswers: {}, fillRatings: {} };
let timelineState = { key: null, slots: [], bank: [], selected: null, checked: false };

function topicBucket(t) {
  const i = t.indexOf(" — ");
  return i === -1 ? t : t.slice(0, i);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

/* ============================= Quiz engine ============================= */

function computeQuizScore(key) {
  const quiz = QUIZZES[key];
  let earned = 0, possible = quiz.items.length * 2;
  quiz.items.forEach((item, i) => {
    if (item.type === "mc") {
      if (quizState.mcAnswers[i] !== undefined && quizState.mcAnswers[i] === item.correct) earned += 2;
    } else {
      if (quizState.fillRatings[i] !== undefined) earned += quizState.fillRatings[i];
    }
  });
  return { earned, possible };
}

function updateScorebar() {
  if (mode === "quiz" && quizState.key !== null) {
    const { earned, possible } = computeQuizScore(quizState.key);
    scorebar.style.display = "block";
    scorebar.textContent = "ציון נוכחי: " + earned + " / " + possible + " נקודות";
  } else {
    scorebar.style.display = "none";
  }
}

function renderQuizSelect() {
  mode = "quiz";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "select-screen";
  wrap.innerHTML = "<h2>שאלוני תיארוך</h2><div class=\"lede\">בחרו נושא — כל שאלון משלב שאלות אמריקאיות והשלמת מקום על תאריכים, סדר אירועים ותקופות מקבילות</div>";
  Object.keys(QUIZZES).forEach((key, idx) => {
    const q = QUIZZES[key];
    const btn = document.createElement("button");
    btn.className = "topic-btn";
    const mcN = q.items.filter((i) => i.type === "mc").length;
    const fillN = q.items.length - mcN;
    btn.innerHTML = '<span class="tb-badge">' + (idx + 1) + '</span><span class="tb-text"><span class="tb-title">' + q.title + '</span><span class="tb-sub">' + q.items.length + ' שאלות (' + mcN + ' אמריקאיות + ' + fillN + ' השלמת מקום) — ' + (q.items.length * 2) + " נק'</span></span>";
    btn.onclick = () => renderQuiz(key);
    wrap.appendChild(btn);
  });
  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = renderHome;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  wrap.appendChild(centerWrap);
  app.appendChild(wrap);
}

function renderQuiz(key) {
  quizState = { key, mcAnswers: {}, fillRatings: {} };
  mode = "quiz";
  const quiz = QUIZZES[key];
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.textContent = quiz.title;
  app.appendChild(h);

  quiz.items.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="qtopic">' + item.topic + '</div><div class="qtext">' + (i + 1) + '. ' + item.q + '</div>';

    if (item.type === "mc") {
      const optWrap = document.createElement("div");
      const letters = ["א", "ב", "ג", "ד"];
      item.options.forEach((opt, oi) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = letters[oi] + ". " + opt;
        b.onclick = () => {
          if (quizState.mcAnswers[i] !== undefined) return;
          quizState.mcAnswers[i] = oi;
          const btns = optWrap.querySelectorAll(".opt");
          btns.forEach((bb, bi) => {
            bb.classList.add("locked");
            if (bi === item.correct) bb.classList.add("correct");
            else if (bi === oi) bb.classList.add("incorrect");
          });
          card.querySelector(".explain").style.display = "block";
          updateScorebar();
        };
        optWrap.appendChild(b);
      });
      card.appendChild(optWrap);
      const exp = document.createElement("div");
      exp.className = "explain";
      exp.textContent = item.exp;
      card.appendChild(exp);
    } else {
      const inp = document.createElement("input");
      inp.type = "text";
      inp.className = "fill-input";
      inp.placeholder = "הקלידו את תשובתכם (רשות)...";
      card.appendChild(inp);

      const revealBtn = document.createElement("button");
      revealBtn.className = "reveal-btn";
      revealBtn.textContent = "בדוק תשובה";
      const answerDiv = document.createElement("div");
      answerDiv.className = "model-answer";
      answerDiv.innerHTML = "<strong>תשובה נכונה:</strong> " + item.answer + "<br>" + item.exp;
      const rateRow = document.createElement("div");
      rateRow.className = "rate-row";
      rateRow.style.display = "none";
      const ratings = [["ידעתי (2)", 2], ["לא ידעתי (0)", 0]];
      ratings.forEach(([label, val]) => {
        const rb = document.createElement("button");
        rb.className = "rate-btn";
        rb.textContent = label;
        rb.onclick = () => {
          quizState.fillRatings[i] = val;
          rateRow.querySelectorAll(".rate-btn").forEach((x) => { x.className = "rate-btn"; });
          rb.classList.add("active-" + val);
          updateScorebar();
        };
        rateRow.appendChild(rb);
      });
      revealBtn.onclick = () => {
        answerDiv.style.display = "block";
        rateRow.style.display = "flex";
        revealBtn.style.display = "none";
      };
      card.appendChild(revealBtn);
      card.appendChild(answerDiv);
      card.appendChild(rateRow);
    }
    app.appendChild(card);
  });

  const finishWrap = document.createElement("div");
  finishWrap.className = "finish-wrap";
  const finishBtn = document.createElement("button");
  finishBtn.className = "finish-btn";
  finishBtn.textContent = "סיים שאלון והצג ציון סופי";
  finishBtn.onclick = () => renderQuizResults(key);
  finishWrap.appendChild(finishBtn);
  app.appendChild(finishWrap);

  updateScorebar();
  window.scrollTo(0, 0);
}

function renderQuizResults(key) {
  const quiz = QUIZZES[key];
  const { earned, possible } = computeQuizScore(key);
  const pct = Math.round((earned / possible) * 100);

  const topics = {};
  quiz.items.forEach((item, i) => {
    const bucket = topicBucket(item.topic);
    topics[bucket] = topics[bucket] || { earned: 0, possible: 0 };
    topics[bucket].possible += 2;
    if (item.type === "mc") {
      if (quizState.mcAnswers[i] === item.correct) topics[bucket].earned += 2;
    } else {
      topics[bucket].earned += quizState.fillRatings[i] || 0;
    }
  });

  app.innerHTML = "";
  const box = document.createElement("div");
  box.className = "results-box";
  let rows = "";
  Object.keys(topics).forEach((t) => {
    rows += '<div class="breakdown-row"><span>' + t + '</span><span>' + topics[t].earned + ' / ' + topics[t].possible + '</span></div>';
  });
  box.innerHTML =
    '<div>סיימתם את ' + quiz.title + '</div>' +
    '<div class="big-score">' + earned + ' / ' + possible + '</div>' +
    '<div class="pct">' + pct + '% הצלחה</div>' +
    '<div class="breakdown">' + rows + '</div>';
  app.appendChild(box);

  const restart = document.createElement("button");
  restart.className = "restart-btn";
  restart.textContent = "חזרה לבחירת שאלון";
  restart.onclick = renderQuizSelect;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(restart);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

/* ============================= Timeline (tap-to-place) engine ============================= */

function renderTimelineSelect() {
  mode = "timeline";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "select-screen";
  wrap.innerHTML = "<h2>ציר זמן גרירה</h2><div class=\"lede\">בחרו ציר זמן — הקישו על פריט ואז על מקומו הכרונולוגי, ובדקו את הסדר</div>";
  Object.keys(TIMELINES).forEach((key, idx) => {
    const t = TIMELINES[key];
    const btn = document.createElement("button");
    btn.className = "topic-btn";
    btn.innerHTML = '<span class="tb-badge">' + (idx + 1) + '</span><span class="tb-text"><span class="tb-title">' + t.title + '</span><span class="tb-sub">' + t.nodes.length + ' פריטים לסידור</span></span>';
    btn.onclick = () => renderTimeline(key);
    wrap.appendChild(btn);
  });
  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = renderHome;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  wrap.appendChild(centerWrap);
  app.appendChild(wrap);
}

function renderTimeline(key) {
  mode = "timeline";
  const t = TIMELINES[key];
  const bank = t.nodes.map((_, i) => i);
  shuffleArray(bank);
  timelineState = { key, slots: new Array(t.nodes.length).fill(null), bank, selected: null, checked: false };
  updateScorebar();
  drawTimeline();
}

function placeInSlot(idx, slotIndex) {
  if (timelineState.checked) return;
  if (timelineState.slots[slotIndex] !== null) return;
  timelineState.bank = timelineState.bank.filter((v) => v !== idx);
  timelineState.slots[slotIndex] = idx;
  timelineState.selected = null;
  drawTimeline();
}

function returnToBank(slotIndex) {
  if (timelineState.checked) return;
  const idx = timelineState.slots[slotIndex];
  if (idx === null) return;
  timelineState.slots[slotIndex] = null;
  timelineState.bank.push(idx);
  timelineState.selected = null;
  drawTimeline();
}

function buildTlCard(idx, slotIndex) {
  const card = document.createElement("div");
  card.className = "tl-card";
  if (timelineState.selected === idx) card.classList.add("selected");
  if (timelineState.checked && slotIndex !== null) {
    card.classList.add(idx === slotIndex ? "correct" : "incorrect");
  }
  const t = TIMELINES[timelineState.key];
  const node = t.nodes[idx];
  const label = document.createElement("div");
  label.className = "tl-card-label";
  label.textContent = node.label;
  card.appendChild(label);
  if (timelineState.checked) {
    const dates = document.createElement("div");
    dates.className = "tl-card-dates";
    dates.textContent = node.dates;
    card.appendChild(dates);
  }
  if (slotIndex !== null && !timelineState.checked) {
    const rm = document.createElement("div");
    rm.className = "tl-remove";
    rm.textContent = "✕";
    rm.title = "החזירו לרשימה";
    rm.onclick = (e) => { e.stopPropagation(); returnToBank(slotIndex); };
    card.appendChild(rm);
  }
  card.onclick = (e) => {
    e.stopPropagation();
    if (timelineState.checked) return;
    if (slotIndex !== null) {
      returnToBank(slotIndex);
    } else {
      timelineState.selected = timelineState.selected === idx ? null : idx;
      drawTimeline();
    }
  };
  return card;
}

function drawTimeline() {
  const t = TIMELINES[timelineState.key];
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.textContent = t.title;
  app.appendChild(h);

  const instr = document.createElement("div");
  instr.className = "tl-instructions";
  instr.textContent = timelineState.selected === null
    ? "הקישו על אחד הפריטים למטה, ואז הקישו על התא בציר שבו הוא צריך להיות."
    : "עכשיו הקישו על התא הריק בציר שבו הפריט שנבחר צריך להיות (או הקישו עליו שוב לביטול הבחירה).";
  app.appendChild(instr);

  const dirHint = document.createElement("div");
  dirHint.className = "tl-dir-hint";
  dirHint.innerHTML = "<span>המוקדם ביותר</span><span>המאוחר ביותר</span>";
  app.appendChild(dirHint);

  const slotsScroll = document.createElement("div");
  slotsScroll.className = "tl-scroll";
  const slotsWrap = document.createElement("div");
  slotsWrap.className = "tl-slots";
  timelineState.slots.forEach((val, i) => {
    const slot = document.createElement("div");
    slot.className = "tl-slot" + (val === null ? " empty" : " filled");
    if (val === null) {
      if (timelineState.selected !== null) slot.classList.add("can-drop");
      slot.textContent = String(i + 1);
    } else {
      slot.appendChild(buildTlCard(val, i));
    }
    slot.onclick = () => {
      if (timelineState.checked) return;
      if (val === null && timelineState.selected !== null) {
        placeInSlot(timelineState.selected, i);
      }
    };
    slotsWrap.appendChild(slot);
  });
  slotsScroll.appendChild(slotsWrap);
  app.appendChild(slotsScroll);

  const bankScroll = document.createElement("div");
  bankScroll.className = "tl-scroll";
  const bankWrap = document.createElement("div");
  bankWrap.className = "tl-bank";
  if (timelineState.bank.length === 0) {
    const done = document.createElement("div");
    done.style.color = "var(--sub)";
    done.style.fontSize = "13px";
    done.style.padding = "8px 4px";
    done.textContent = timelineState.checked ? "" : "כל הפריטים מוקמו — לחצו 'בדוק סדר'.";
    bankWrap.appendChild(done);
  } else {
    timelineState.bank.forEach((idx) => {
      bankWrap.appendChild(buildTlCard(idx, null));
    });
  }
  bankScroll.appendChild(bankWrap);
  app.appendChild(bankScroll);

  const controls = document.createElement("div");
  controls.className = "tl-controls";
  if (!timelineState.checked) {
    const checkBtn = document.createElement("button");
    checkBtn.className = "finish-btn";
    checkBtn.textContent = "בדוק סדר";
    checkBtn.disabled = timelineState.bank.length > 0;
    checkBtn.onclick = () => {
      if (timelineState.bank.length > 0) return;
      timelineState.checked = true;
      drawTimeline();
    };
    controls.appendChild(checkBtn);
  }
  const resetBtn = document.createElement("button");
  resetBtn.className = "restart-btn";
  resetBtn.textContent = "התחל מחדש";
  resetBtn.onclick = () => renderTimeline(timelineState.key);
  controls.appendChild(resetBtn);
  const backBtn = document.createElement("button");
  backBtn.className = "restart-btn";
  backBtn.textContent = "חזרה לבחירת ציר זמן";
  backBtn.onclick = renderTimelineSelect;
  controls.appendChild(backBtn);
  app.appendChild(controls);

  if (timelineState.checked) {
    const correctCount = timelineState.slots.filter((v, i) => v === i).length;
    const resultMsg = document.createElement("div");
    resultMsg.className = "tl-result";
    resultMsg.textContent = correctCount + " מתוך " + t.nodes.length + " במקום הכרונולוגי הנכון";
    app.appendChild(resultMsg);
  }
  window.scrollTo(0, 0);
}

/* ============================= Kings Gantt chart ============================= */

function renderKingsTable() {
  mode = "kings";
  updateScorebar();
  app.innerHTML = "";

  const h = document.createElement("div");
  h.className = "section-title";
  h.style.textAlign = "center";
  h.textContent = "מלכי ישראל ויהודה";
  app.appendChild(h);
  const sub = document.createElement("div");
  sub.className = "section-sub";
  sub.style.textAlign = "center";
  sub.textContent = "כל השנים לפני הספירה — הקישו על מלך לפרטים";
  app.appendChild(sub);

  const strip = document.createElement("div");
  strip.className = "united-strip";
  KINGS_GANTT.united.forEach((k) => {
    const item = document.createElement("div");
    item.className = "united-item";
    item.innerHTML = '<div class="u-name">' + k.name + '</div><div class="u-years">' + k.start + '–' + k.end + ' לפנה"ס</div>';
    strip.appendChild(item);
  });
  app.appendChild(strip);

  const legend = document.createElement("div");
  legend.className = "kg-legend";
  legend.innerHTML =
    '<span><span class="dot" style="background:var(--judah)"></span>מלכי יהודה</span>' +
    '<span><span class="dot" style="background:var(--israel)"></span>מלכי ישראל</span>' +
    '<span><span class="dot" style="background:var(--ink)"></span>אירוע (חורבן)</span>' +
    '<span><span class="dot" style="background:transparent;border-radius:50%;box-shadow:0 0 0 2px var(--gold) inset"></span>מלך מרכזי</span>' +
    '<span><span class="kg-prophet-pill-legend">נביא</span>שם נביא ליד תקופתו</span>';
  app.appendChild(legend);

  const allEntries = KINGS_GANTT.judah.concat(KINGS_GANTT.israel);
  const AXIS_START = Math.max(...allEntries.map((k) => k.start));
  const AXIS_END = KINGS_GANTT.axisEnd;
  const SCALE_V = 2.6;
  const totalYears = AXIS_START - AXIS_END;
  const chartHeight = Math.round(totalYears * SCALE_V);

  function yTop(year) { return Math.round((AXIS_START - year) * SCALE_V); }

  const vwrap = document.createElement("div");
  vwrap.className = "kg-vwrap";

  const heads = document.createElement("div");
  heads.className = "kg-vheads";
  heads.innerHTML =
    '<div class="kg-vhead" style="--kc:var(--judah)"><span class="dot"></span>יהודה</div>' +
    '<div></div>' +
    '<div class="kg-vhead" style="--kc:var(--israel)"><span class="dot"></span>ישראל</div>';
  vwrap.appendChild(heads);

  const body = document.createElement("div");
  body.className = "kg-vbody";
  body.style.height = chartHeight + "px";

  const tickStep = 20;
  for (let y = Math.floor(AXIS_START / tickStep) * tickStep; y >= AXIS_END; y -= tickStep) {
    if (y > AXIS_START) continue;
    const line = document.createElement("div");
    line.className = "kg-vgridline";
    line.style.top = yTop(y) + "px";
    body.appendChild(line);
    const tick = document.createElement("div");
    tick.className = "kg-vtick";
    tick.style.top = yTop(y) + "px";
    tick.textContent = y;
    body.appendChild(tick);
  }

  const detail = document.createElement("div");
  detail.className = "kg-detail";

  function showKingDetail(k, kingdom) {
    detail.classList.add("show");
    const yearCount = k.start - k.end;
    const yearWord = yearCount === 1 ? "שנה אחת" : yearCount === 2 ? "שנתיים" : yearCount + " שנים";
    const years = k.start === k.end ? (k.start + ' לפנה"ס') : (k.start + '–' + k.end + ' לפנה"ס (' + yearWord + ')');
    detail.innerHTML =
      '<div class="kd-name">' + k.name + ' <span style="font-size:13px;color:var(--sub);font-weight:400">— ' + kingdom + '</span>' +
      (k.important ? ' <span class="kd-important">מלך מרכזי</span>' : '') + '</div>' +
      '<div class="kd-years">' + years + '</div>' +
      (k.prophet ? '<div class="kd-prophet">נביאים בני התקופה: ' + k.prophet + '</div>' : '');
    detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function computeProphetRuns(kings) {
    const seq = kings.filter((k) => !k.row && !k.isEvent);
    const runs = [];
    let cur = null;
    seq.forEach((k) => {
      if (!k.prophet) { cur = null; return; }
      if (cur && cur.text === k.prophet) {
        cur.endYear = k.end;
        cur.members.push(k);
      } else {
        cur = { text: k.prophet, startYear: k.start, endYear: k.end, members: [k] };
        runs.push(cur);
      }
    });
    runs.forEach((run) => {
      const soleHeight = run.members.length === 1 ? (run.members[0].start - run.members[0].end) * SCALE_V : 0;
      run.external = !(run.members.length === 1 && soleHeight >= 26);
      if (run.external) run.members.forEach((m) => { m._extProphet = true; });
    });
    return runs;
  }

  const judahRuns = computeProphetRuns(KINGS_GANTT.judah);
  const israelRuns = computeProphetRuns(KINGS_GANTT.israel);

  function buildCol(className, colorVar, kings, title) {
    const col = document.createElement("div");
    col.className = "kg-vcol " + className;
    kings.forEach((k) => {
      const bar = document.createElement("div");
      const isCoRegent = !!k.row;
      const hasProphet = !!k.prophet;
      bar.className = "kg-vbar" +
        (k.isEvent ? " event-marker" : "") +
        (isCoRegent ? " co-regent" : "") +
        (k.important ? " important" : "");
      const trueHeight = (k.start - k.end) * SCALE_V;
      const height = Math.max(trueHeight, k.isEvent ? 8 : 4);
      bar.style.height = height + "px";
      bar.style.top = yTop(k.start) + "px";
      bar.style.zIndex = isCoRegent ? 10 : (height < 16 ? 4 : 1);
      if (!k.isEvent) bar.style.background = colorVar;
      if (height < 18 && !k.isEvent) {
        bar.classList.add("thin");
      } else {
        const nameSpan = document.createElement("span");
        nameSpan.className = "kv-name";
        nameSpan.textContent = k.name;
        bar.appendChild(nameSpan);
        if (hasProphet && height >= 26 && !k._extProphet) {
          const propSpan = document.createElement("span");
          propSpan.className = "kv-prophet";
          propSpan.textContent = k.prophet;
          bar.appendChild(propSpan);
        }
      }
      bar.title = k.name + " (" + (k.start === k.end ? k.start : k.start + "–" + k.end) + " לפנה\"ס)" + (k.prophet ? " — נביא: " + k.prophet : "") + (k.important ? " — מלך מרכזי" : "");
      bar.onclick = () => {
        body.querySelectorAll(".kg-vbar.active").forEach((b) => b.classList.remove("active"));
        bar.classList.add("active");
        showKingDetail(k, title);
      };
      col.appendChild(bar);
    });
    return col;
  }

  function renderProphetPills(runs, side) {
    runs.filter((r) => r.external).forEach((run) => {
      const topPx = yTop(run.startYear);
      const botPx = yTop(run.endYear);
      const pill = document.createElement("div");
      pill.className = "kg-prophet-pill kg-prophet-pill-" + side;
      pill.style.top = Math.round((topPx + botPx) / 2) + "px";
      pill.textContent = run.text;
      pill.title = "נביא: " + run.text + " — " + run.members.map((m) => m.name).join(", ");
      body.appendChild(pill);
    });
  }

  body.appendChild(buildCol("kg-vcol-judah", "var(--judah)", KINGS_GANTT.judah, "יהודה"));
  const axisCol = document.createElement("div");
  axisCol.className = "kg-vaxis";
  body.appendChild(axisCol);
  body.appendChild(buildCol("kg-vcol-israel", "var(--israel)", KINGS_GANTT.israel, "ישראל"));
  renderProphetPills(judahRuns, "judah");
  renderProphetPills(israelRuns, "israel");

  vwrap.appendChild(body);
  app.appendChild(vwrap);
  app.appendChild(detail);

  const src = document.createElement("div");
  src.className = "kg-source";
  src.textContent = KINGS_GANTT.source;
  app.appendChild(src);

  const back = document.createElement("div");
  back.className = "backlink";
  back.textContent = "⟵ חזרה למסך הראשי";
  back.onclick = renderHome;
  const centerWrap = document.createElement("div");
  centerWrap.style.textAlign = "center";
  centerWrap.appendChild(back);
  app.appendChild(centerWrap);
  window.scrollTo(0, 0);
}

/* ============================= Home ============================= */

function renderHome() {
  mode = "home";
  updateScorebar();
  app.innerHTML = "";
  const wrap = document.createElement("div");

  const intro = document.createElement("div");
  intro.className = "home-hero";
  const stripColors = ["var(--line)", "var(--line)", "var(--judah-soft)", "var(--judah)", "var(--judah)", "var(--gold)", "var(--gold)", "var(--israel-soft)", "var(--israel)", "var(--israel)", "var(--ink)", "var(--gold)", "var(--judah)", "var(--israel)", "var(--gold)", "var(--ink)"];
  let stripHtml = '<div class="hero-strip">' + stripColors.map((c) => '<span style="background:' + c + '"></span>').join("") + '</div>';
  intro.innerHTML = stripHtml + "<h2>מה קדם למה?</h2><p>שלושה כלי תרגול שמתמקדים אך ורק בציר הזמן ההיסטורי — תיארוך תקופות ואירועים, סדר כרונולוגי, ותקופות מקבילות.</p>";
  wrap.appendChild(intro);

  const grid = document.createElement("div");
  grid.className = "mode-grid";

  const ICONS = {
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>',
    compass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><polygon points="15.5 8.5 13.3 13.3 8.5 15.5 10.7 10.7 15.5 8.5"/></svg>',
    crown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 18h17M4.5 18 3 8.2l5.2 3.8L12 5.5l3.8 6.5L21 8.2 19.5 18"/></svg>',
  };
  const cards = [
    { icon: ICONS.calendar, accent: "var(--gold)", title: "שאלוני תיארוך", desc: "מתי הייתה כל תקופה, מה קרה קודם, ואיזו תקופה מקבילה לאיזו — לפי נושא.", fn: renderQuizSelect },
    { icon: ICONS.compass, accent: "var(--israel)", title: "ציר זמן גרירה", desc: "הציבו תקופות, אירועים ודמויות במקומם הכרונולוגי הנכון על ציר הזמן.", fn: renderTimelineSelect },
    { icon: ICONS.crown, accent: "var(--judah)", title: "מלכי ישראל ויהודה", desc: "גרף זמן מלא: כל המלכים על ציר משותף, לפי שנות מלכותם והנביאים בני זמנם.", fn: renderKingsTable },
  ];
  cards.forEach((c) => {
    const card = document.createElement("div");
    card.className = "mode-card";
    card.style.setProperty("--mc", c.accent);
    card.innerHTML = '<div class="icon-badge">' + c.icon + '</div><h3>' + c.title + '</h3><p>' + c.desc + '</p>';
    card.onclick = c.fn;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  app.appendChild(wrap);
}

renderHome();

</script>
</body>
</html>
